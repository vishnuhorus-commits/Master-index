data:text/html,<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Master Index</title><style>*{box-sizing:border-box}body{background:#0a0c12;font-family:-apple-system;margin:0;padding:16px;color:#e2e8f0}.container{max-width:1000px;margin:0 auto}h1{font-size:1.6rem;color:#c084fc}.card{background:#111827;border-radius:1.5rem;padding:1.25rem;border:1px solid #1f2937;margin-bottom:1rem}textarea{width:100%;background:#030712;border:1px solid #334155;border-radius:1rem;padding:1rem;color:#f1f5f9;font-family:monospace}button{background:#3b82f6;border:none;padding:0.6rem 1.2rem;border-radius:2rem;font-weight:600;color:white;cursor:pointer;margin-top:0.5rem}.stats{display:flex;gap:1rem;margin-top:0.75rem}.stat{background:#1e293b;border-radius:1rem;padding:0.5rem 1rem}.stat-number{font-size:1.5rem;font-weight:bold;color:#facc15}.stat-label{font-size:0.65rem;color:#94a3b8}.toast{position:fixed;bottom:20px;right:20px;background:#10b981;padding:8px 16px;border-radius:40px;opacity:0}</style></head><body><div class="container"><h1>📖 MASTER INDEX</h1><div class="card"><textarea id="pasteArea" rows="10" placeholder="Paste your lines here..."></textarea><button id="mergeBtn">MERGE INTO MASTER</button><div class="stats"><div class="stat"><div class="stat-number" id="pendingCount">0</div><div class="stat-label">To add</div></div><div class="stat"><div class="stat-number" id="masterTotal">0</div><div class="stat-label">Total lines</div></div></div></div><div class="card"><button id="downloadBtn">DOWNLOAD MASTER.txt</button></div></div><div id="toastMsg" class="toast">Done</div><script>const MASTER_KEY="master_index";let masterSet=new Set();function loadMaster(){const s=localStorage.getItem(MASTER_KEY);if(s){try{const arr=JSON.parse(s);masterSet=new Set(arr)}catch(e){}}document.getElementById('masterTotal').textContent=masterSet.size}function saveMaster(){const arr=Array.from(masterSet);localStorage.setItem(MASTER_KEY,JSON.stringify(arr));document.getElementById('masterTotal').textContent=masterSet.size}function addLines(lines){let newCount=0;for(let line of lines){let clean=line.trim().toUpperCase().replace(/\s+/g,' ');if(clean.length>=2&&!masterSet.has(clean)){masterSet.add(clean);newCount++}}if(newCount>0)saveMaster();return newCount}function processPaste(){const text=document.getElementById('pasteArea').value;if(!text.trim())return;const lines=text.split(/\r?\n/);const newCount=addLines(lines);showToast(`Added ${newCount} new lines`);document.getElementById('masterTotal').textContent=masterSet.size;updatePendingCount()}function updatePendingCount(){const text=document.getElementById('pasteArea').value;const lines=text.split(/\r?\n/).filter(l=>l.trim().length>0);document.getElementById('pendingCount').textContent=lines.length}function downloadMaster(){if(masterSet.size===0){showToast("Master is empty",true);return}const arr=Array.from(masterSet).sort();const content=arr.join('\n');const blob=new Blob([content],{type:'text/plain'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`MASTER_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.txt`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);showToast("Downloaded")}function showToast(msg,isError=false){const t=document.getElementById('toastMsg');t.textContent=msg;t.style.background=isError?'#dc2626':'#10b981';t.style.opacity='1';setTimeout(()=>t.style.opacity='0',1800)}document.getElementById('mergeBtn').addEventListener('click',processPaste);document.getElementById('downloadBtn').addEventListener('click',downloadMaster);document.getElementById('pasteArea').addEventListener('input',updatePendingCount);loadMaster();updatePendingCount();</script></body></html>
